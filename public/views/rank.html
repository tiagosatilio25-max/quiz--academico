<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking do Quiz</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <div class="ranking-container">
        <h2>Top Pontuadores</h2>
        
        <div class="ranking-list">
            <!-- Primeiro Lugar -->
            <div class="ranking-item gold">
                <span class="pos">1º</span>
                <span class="name">Ana Silva</span>
                <span class="score">1500 pts</span>
            </div>

            <!-- Segundo Lugar -->
            <div class="ranking-item silver">
                <span class="pos">2º</span>
                <span class="name">Marcos Souza</span>
                <span class="score">1350 pts</span>
            </div>

            <!-- Terceiro Lugar -->
            <div class="ranking-item bronze">
                <span class="pos">3º</span>
                <span class="name">Julia Costa</span>
                <span class="score">1200 pts</span>
            </div>

            <!-- Outros Jogadores -->
            <div class="ranking-item">
                <span class="pos">4º</span>
                <span class="name">Ricardo Oliveira</span>
                <span class="score">950 pts</span>
            </div>

            <div class="ranking-item">
                <span class="pos">5º</span>
                <span class="name">Beatriz Lima</span>
                <span class="score">800 pts</span>
            </div>
        </div>

        <button onclick="window.location.href='index.html'" class="btn-voltar">Jogar Novamente</button>
    </div>


    <script src="script.js"></script>

</script>
</body>
</html>
